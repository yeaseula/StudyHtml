<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>width,height</title>
    <style>
        .width {
            border: 1px solid black;
        }
        .auto {
            /* 기본값, 부모 요소를 기준으로 가질 수 있는 최대넓이 */
            width: auto;
        }
        .min {
            /* 요소가 가질 수 있는 최소 너비
                영어 : 가장 긴 단어
                한글 : 한 글자
            */
            width: min-content;
        }
        .max {
            /* 줄바꿈 없이 가질 수 있는 최대 너비
                부모 요소를 벗어날 수 있다
            */
            width: max-content;
        }
        .fit {
            /*
                콘텐츠의 크기에 맞게 유동적으로 변경됨
            */
            width: fit-content;
        }
        .units {
            width: 200px;
            width: 50vw;
        }
        .height {
            background-color: green;
            /* 기본값
                콘텐츠의 높이만큼만 자동으로 지정
            */
            height: auto;
        }
        .child {
            background-color: thistle;
            height: 50px;
            /*
                %단위는 부모요소의 높이가 값으로 명시되어 있어야 함
            */
            height: 50%;
        }
    </style>
  </head>
  <body>
    <div class="width auto">auto 속성을 적용할 요소</div>
    <div class="width min">min-content 속성을 적용할 요소</div>
    <div class="width max">max-content 속성을 적용할 요소</div>
    <div class="width fit">fit-content 속성을 적용할 요소</div>
    <div class="width units">단위사용</div>

    <div class="height">height 부모요소
        <div class="child">child요소</div>
    </div>
  </body>
</html>
