<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹페이지 레이아웃</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 100px 200px 200px;
            grid-template-rows: 60px 200px 200px 100px;
            grid-template-areas:
            "header header header"
            "aside main nav"
            "aside main ."
            "footer footer footer"
        }
        header {
            background-color: pink;
            grid-area: header;
        }
        nav {
            background-color: yellow;
            grid-area: nav;
        }
        main {
            background-color: steelblue;
            grid-area: main;
        }
        aside {
            background-color: chocolate;
            grid-area: aside;
        }
        footer {
            background-color: coral;
            grid-area: footer;
        }
    </style>
  </head>
  <body>
    <div class="container">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <aside>aside</aside>
        <footer>footer</footer>
    </div>
  </body>
</html>
