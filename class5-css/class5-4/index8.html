<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 과제</title>
    <style>
      @font-face {
          font-family: 'Pretendard-Regular';
          src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
          font-weight: 400;
          font-style: normal;
      }
      *{line-height: 1.6; margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard-Regular';}
      .container {
        margin: 50px auto;
        width: 288px;
        box-shadow: 2px 2px 8px 0px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        overflow: hidden;
      }
      .img-box {
        width: 100%;
        height: 196px;
      }
      .img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .text-box {
        padding: 20px 16px;
        background-color: #fff;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
      }
      .cont {
        margin: 16px 0;
        font-size: 12px;
        color: rgba(90, 106, 114, 1);
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .read-btn {
        font-size: 14px;
        font-weight: 700;
        color: rgba(41, 54, 61, 1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="img-box">
        <img src="./img/card-img.jpg" alt="카드이미지">
      </div>
      <div class="text-box">
        <p class="title">그것을 피가 청춘을 것이다</p>
        <p class="cont">
          청춘의 하였으며, 이것은 몸이 때문이다.
          사는가 고동을 용기가 충분히 청춘 것이다.
          얼마나 반짝이는 소담스러운 열락의 아름다우냐?
          가지에 같지 청춘의 옷을 목숨을 피어나기 오직 군영과 칼이다.
          거친 끓는 예가 뿐이다. 방지하는 꽃이 청춘을 생명을 이것이다.
          인간의 거선의 피고, 모래뿐일 작고 우리 평화스러운 있는가?
        </p>
        <a href="#" class="read-btn">Read</a>
      </div>
    </div>
  </body>
</html>
