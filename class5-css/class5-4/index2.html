<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 비율유지~</title>
    <style>
        /* 첫 번째 방법 : aspect-ratio */
        .frog {
            width: 50%;
            /* IE와 구버전 브라우저는 지원 안할 수 있음 ㅠ */
            aspect-ratio: 4/3;
            /* 요소 크기 가득, 원본 비율 유지 */
            object-fit: cover;
            object-fit: contain;
            /* 원본크기 유지 */
            object-fit: cover;
            object-fit: none;
            border: 1px solid red;
        }

        /* 두번째 방법 - padding-top 이용 */
        .contaiver {
            position: relative;
            width: 100%;
            /* padding-top % -> 부모요소의 너비를 기준으로
                x : y = 100 / x * y 로 계산합니다
            */
            padding-top: 50%;
            height: 0;
            border: 1px solid blue;
        }

        .contaiver img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
  <body>
    <img src="./img/weniv-garry.png" class="frog" alt="개굴">

    <div class="contaiver">
        <img src="./img/weniv-chilli.png">
    </div>
  </body>
</html>
