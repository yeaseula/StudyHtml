<!DOCTYPE html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transform</title>
    <style>
        .item {
            width: 150px;
            height: 150px;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1s;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 100px;
        }
        .item:first-child:hover {
            background-color: saddlebrown;
            /* %는 자기 자신의 크기를 기준으로 함 */
            transform: translate(10px,10px);
        }
        .item:nth-child(2):hover {
            background-color: yellow;
            transform: scale(2,1);
            transform: scale(0.8);
            transform: scaleX(3);
        }
        .item:nth-child(3):hover {
            background-color: antiquewhite;
            transform: rotate(157deg);
        }
        .item:nth-child(4):hover {
            background-color: salmon;
            transform: skew(30deg,20deg);
        }
        .item:nth-child(5):hover {
            background-color: turquoise;
            transform: translate(100px,50px) rotate(45deg) skew(15deg);
        }

    </style>
  </head>
  <body>
    <div class="container">
        <div class="item">이동</div>
        <div class="item">크기조절</div>
        <div class="item">회전</div>
        <div class="item">기울이기</div>
        <div class="item">전체</div>
    </div>
  </body>
</html>
